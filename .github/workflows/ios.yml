name: iOS Simulator

# Unsigned build for the iOS simulator. Install with
#   unzip cumTempore-iphonesimulator.zip && xcrun simctl install booted cumTempore.app

on:
  push:
    branches: [ develop ]
    paths-ignore:
      - "**.md"
      - "website/**"
      - "fastlane/**"
      - "metadata/**.xml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Read Qt version
      run: echo "QT_VERSION=$(cat .github/qt-version)" >> $GITHUB_ENV
    - name: Install Qt for iOS
      uses: jurplel/install-qt-action@v4
      with:
        cache: true
        cache-key-prefix: install-qt-action-ios
        target: ios
        # Since Qt 6.12, the iOS kit is split into ios_device,
        # ios_simulator_arm64 and ios_simulator_x86_64; "ios" is device-only.
        arch: ios_simulator_arm64
        version: ${{ env.QT_VERSION }}
        # aqtinstall 3.3.0 does not support the Qt 6.12 iOS split. Pinned to the
        # head of https://github.com/miurahr/aqtinstall/pull/1048 until it is
        # merged and released.
        aqtsource: git+https://github.com/jdpurcell/aqtinstall.git@6f0f842da47c744cdc814cd94da9828d934d7bf0
        # Installed from git, aqt reports version 0.1.devN, so the action does
        # not add --autodesktop itself; the macOS host kit is needed for
        # QT_HOST_PATH.
        extra: --autodesktop
    - name: Configure
      run: |
        $QT_ROOT_DIR/bin/qt-cmake -S . -B build -G Xcode -DQT_HOST_PATH="$(dirname "$QT_ROOT_DIR")/macos"
    - name: Build
      run: |
        cmake --build build --config Debug -- -sdk iphonesimulator -arch arm64 CODE_SIGNING_ALLOWED=NO
    - name: Package
      run: |
        cd build/src/Debug-iphonesimulator
        zip -r -y ../../../cumTempore-iphonesimulator.zip cumTempore.app
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: cumTempore-iphonesimulator
        path: cumTempore-iphonesimulator.zip
    - name: Upload to developerBuilds
      if: github.event_name == 'push'
      run: .github/scripts/upload-developer-build.sh cumTempore-iphonesimulator.zip
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
