<header>
  <nav>
    <a class="brand" href="{{ "/" | relURL }}">
      <img src="{{ "images/icon-192.png" | relURL }}" alt="" width="32" height="32">
      {{ site.Title }}
    </a>
    <ul>
      {{ $current := . }}
      {{ range site.Menus.main }}
      <li><a href="{{ .URL }}"{{ if $current.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{ end }}
    </ul>
  </nav>
</header>
